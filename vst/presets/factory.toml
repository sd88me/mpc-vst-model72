# The CA-72's factory presets, built into the plug-in. Each preset sets the panel as its dials
# print (a choice by its index: RANGE LO, 32', 16', 8', 4', 2' are 0 to 5; WAVEFORM triangle
# to narrow rectangle 0 to 5; a switch 0 off, 1 on); a control it does not name is at its
# default, but MIDI BEND RANGE (the player's) is left as it is. `poly` (0 or 1), `voices`,
# `entropy` and `spread` (0 to 100) are POLY, VOICES, ENTROPY and SPREAD: every preset names
# them. The PITCH wheel is never part of a preset. Oscillators 2 and 3's FREQUENCY name their
# pots' positions, -7.5 to 7.5 along the track, as every version saves them; the knob reads
# them in semitones, or as the hardware's dial, the player's choice (decisions.md R54).
#
# 0.2.0's set, the owner's choice (decisions.md R63): the presets the owner had starred,
# each as they had it, those 0.1 carried under new names (0.1's own are in `retired.toml`). The
# first seventeen began as 0.1's: its Bass, nine documented patches for the instrument the CA-72
# models (its maker's 1974 sound charts, its 2016 reissue's patch sheets, recreations by ear), a
# drum kit and riser from the panel alone (one instance a drum) and a POLY pad. White Lotus is a
# held bass fitted to a recording by measurement (R43); Cycle of Fifths, last, the owner's. MAIN
# OUTPUT VOLUME, then LEVEL where VOLUME is at 10, levels them against each other (measured
# on the model: `tests/preset_levels.rs`).
format = 1

